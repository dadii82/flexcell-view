<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<!-- Admin stranica: kao user stranica (mobile-status.html), ali s trazenjem analize i pregledima. Aplikacija je NE objavljuje
     automatski (auto-objava dira samo cfg.page = index.html), pa se gura rucno preko gh/GitHuba. -->
<meta name="flexcell-page-version" content="2.5.83">
<title>Flexcell - admin</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--dim:#94a3b8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--idle:#64748b}
*{box-sizing:border-box}
body{margin:0;padding:12px 12px 28px;background:var(--bg);color:var(--txt);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;align-items:center;gap:8px;margin:2px 2px 12px}
h1{margin:0;font-size:17px;letter-spacing:.02em;flex:1}
#age{font-size:12px;color:var(--dim);white-space:nowrap}
#age.stale{color:var(--bad);font-weight:700}
.gear,.lang{appearance:none;border:1px solid var(--line);background:#0b1220;color:var(--txt);font-size:15px;line-height:1;padding:6px 9px;border-radius:9px}
.lang{font-size:12px;font-weight:800;letter-spacing:.03em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:10px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mach{font-size:20px;font-weight:800;letter-spacing:.03em}
.badge{margin-left:auto;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:999px;border:1px solid}
.b-rad{color:#bbf7d0;border-color:#166534;background:#14532d}
.b-pod{color:#fde68a;border-color:#92400e;background:#78350f}
.b-pau{color:#fed7aa;border-color:#9a3412;background:#7c2d12}
.b-stoj{color:#e2e8f0;border-color:#475569;background:#334155}
.b-got{color:#a5f3fc;border-color:#0e7490;background:#164e63}
.b-prazno{color:#cbd5e1;border-color:#475569;background:#1e293b}
.prog{font-size:15px;font-weight:700}
.ip{color:var(--dim);font-size:13px}
.bar{position:relative;height:22px;border-radius:999px;background:#0b1220;border:1px solid var(--line);overflow:hidden;margin:9px 0 7px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#0ea5e9,#22c55e);transition:width .4s ease}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.kv{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--dim)}
.kv b{color:var(--txt);font-weight:700}
.next{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim)}
.next b{color:#cbd5e1}
.stalenote{margin:-2px 0 6px;font-size:12px;font-weight:700;color:var(--warn)}
.card.hasimg{cursor:pointer}
.imgtag{font-size:14px;line-height:1;opacity:.75}
.tooltag{font-size:15px;line-height:1;padding:3px 7px;margin:-3px 0;border-radius:8px;border:1px solid var(--line);background:#0b1220;cursor:pointer}
#tl{padding:4px 0 30px;min-height:100vh}
body.tlpage>*:not(#tl):not(#offline){display:none!important}
#tl .tlbox{max-width:760px;margin:0 auto}
#tl .tlhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
#tl .tlhead b{flex:1;font-size:17px}
#tl .tlhead button{padding:6px 12px}
#tl .tlsec{margin:14px 0 6px;font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
#tl .lane{position:relative;border-radius:8px;background:#0b1220;border:1px solid var(--line);margin:6px 0;overflow:hidden}
#tl .lane .cl{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#ef4444;opacity:.7}
#tl .lane.uw .lb{top:auto;bottom:6px}
#tl .lane .lb{position:absolute;z-index:1;left:6px;top:6px;font-size:10px;font-weight:800;color:var(--dim)}
#tl .lane .blk{position:absolute;top:14px;bottom:5px;min-width:3px;border-radius:4px;background:#3b82f6;border:1px solid #93c5fd}
#tl .lane.uw .blk{background:#16a34a;border-color:#86efac}
#tl .trow{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(51,65,85,.55);font-size:14px}
#tl .trow .k{flex:0 0 34px;font-weight:800;color:var(--dim)}
#tl .trow .n{flex:1;min-width:0}
#tl .trow .n small{display:block;color:var(--dim);font-size:11px}
#tl .trow .v{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
#tl .trow .n .tf{color:#fbbf24;font-weight:700}
#tl .trow .v .th{display:block;margin-top:2px;font-size:12px;font-weight:700;color:#fbbf24}
#tl .tltop{display:flex;gap:10px;align-items:flex-start;margin:0 0 6px}
#tl .tltop .tlimg{flex:0 0 42%;margin:0;min-height:90px}
#tl .tltop .tlimg img{max-height:34vh}
#tl .tlprops{flex:1;min-width:0;font-size:12.5px}
#tl .tlprops .pr{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid rgba(51,65,85,.5)}
#tl .tlprops .k{color:var(--dim);flex:0 0 auto}
#tl .tlprops .v{font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
#tl .tlprops .v small{color:var(--dim);font-weight:400}
#tl .tlprops .frno{color:#f87171;font-weight:800}#tl .tlprops .frok{color:#4ade80;font-weight:700}
#tl{cursor:pointer}
#tl .tlimg{margin:0 0 6px;border-radius:12px;border:1px solid var(--line);background:#fff;overflow:hidden;min-height:120px;display:flex;align-items:center;justify-content:center}
#tl .tlimg img{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain}
#tl .tlimg span{color:#64748b;font-size:13px;padding:20px}
#tl .ticons{position:relative;margin:4px 0 -2px}
#tl .ticons.uw{margin:-2px 0 6px}
#tl .ticons .ti{position:absolute;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
#tl .ticons.ow .ti{bottom:auto;top:0}
#tl .ticons .ti svg{display:block;overflow:visible}
#tl .ticons .ti i{position:absolute;top:-4px;right:-10px;font-style:normal;font-size:12px;font-weight:900;color:#fbbf24}
#tl .tnone{color:var(--dim);font-size:13px;padding:6px 0}
.sum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--dim);padding:2px 4px}
.sum b{color:var(--txt)}
button{appearance:none;border:1px solid var(--line);background:#0b1220;color:var(--txt);font:600 13px inherit;padding:9px 14px;border-radius:10px}
button.pri{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
button[disabled]{opacity:.5}
select{appearance:none;border:1px solid var(--line);background:#0b1220;color:var(--txt);font:600 13px inherit;padding:9px 10px;border-radius:10px}
.anahead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.anastate{margin-left:auto;font-size:12px;color:var(--dim);text-align:right}
.anastate.work{color:var(--warn);font-weight:700}
.anastate.ok{color:var(--ok);font-weight:700}
.anastate.bad{color:var(--bad);font-weight:700}
.anarow{display:flex;gap:8px;align-items:center}
.anahint{font-size:12px;color:var(--dim);margin-top:9px;line-height:1.45}
.analist{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
.anaitem{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid rgba(51,65,85,.55)}
.anaitem:last-child{border-bottom:0}
.anaitem .nm{flex:1;min-width:0}
.anaitem .nm b{display:block;font-weight:700;color:var(--txt)}
.anaitem .nm span{color:var(--dim);font-size:11px}
.anaitem button{padding:6px 11px;font-size:12px;white-space:nowrap}
.analistempty{font-size:12px;color:var(--dim);padding:4px 0}
.uselist{margin-top:4px}
.useitem{padding:10px 0;font-size:13px;border-bottom:1px solid rgba(51,65,85,.55)}
.useitem:last-child{border-bottom:0}
.useitem .uhead{display:flex;align-items:center;gap:8px}
.useitem input{flex:1;min-width:0;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:#0b1220;color:var(--txt);font:600 14px inherit}
.useitem .ubadge{flex:0 0 auto;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;background:rgba(51,65,85,.6);color:var(--txt)}
.useitem .ubadge.on{background:rgba(22,163,74,.22);color:#4ade80}
.useitem .umeta{margin-top:5px;color:var(--dim);font-size:11px}
.useitem .uviews{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.useitem .uviews span{padding:3px 7px;border-radius:6px;background:#0b1220;border:1px solid var(--line);color:var(--txt);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.useitem .uviews span:first-child{border-color:#3b82f6}
.useempty{font-size:12px;color:var(--dim);padding:4px 0}
.usrform{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.usrform input{flex:1 1 140px;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#0b1220;color:var(--txt);font:14px inherit}
.usrform select,.usritem select{padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:#0b1220;color:var(--txt);font:13px inherit}
.usrnew{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid #16a34a;background:rgba(22,163,74,.12);font-size:13px;line-height:1.6}
.usrnew code{font-size:16px;font-weight:800;color:#4ade80;letter-spacing:.04em;user-select:all}
.usrlist{margin-top:8px}
#pov .povdays{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
#pov .povdays button{flex:0 0 auto;font-size:12px;padding:6px 10px;line-height:1.15;text-align:center}
#pov .povdays button small{display:block;font-size:10px;font-weight:600;color:var(--dim)}
#pov .povdays button.on{background:#1d4ed8;border-color:#3b82f6;color:#fff}
#pov .povdays button.on small{color:#dbeafe}
#pov .povm{margin:12px 0 4px}
#pov .povm+.povm{padding-top:10px;border-top:1px solid var(--line)}
#pov .ph{display:flex;align-items:baseline;gap:8px}
#pov .ph b{font-size:17px;letter-spacing:.03em}
#pov .ph span{margin-left:auto;font-size:12px;color:var(--dim);text-align:right}
#pov .ph span em{font-style:normal;color:var(--txt);font-weight:700}
#pov .pbar{position:relative;height:26px;border-radius:7px;background:#0b1220;border:1px solid var(--line);overflow:hidden;margin:7px 0 2px}
#pov .pbar i{position:absolute;top:3px;bottom:3px;min-width:2px;border-radius:2px}
#pov .pbar .tk{position:absolute;top:0;bottom:0;width:1px;background:rgba(148,163,184,.22)}
#pov .pbar .fut{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(148,163,184,.14) 5px 10px)}
#pov .pticks{position:relative;height:14px;font-size:10px;color:var(--dim);margin-bottom:4px}
#pov .pticks span{position:absolute;transform:translateX(-50%)}
#pov .pticks span:first-child{transform:none}
#pov .pticks span:last-child{transform:translateX(-100%)}
#pov .pord{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid rgba(51,65,85,.55);font-size:13px}
#pov .pord:last-child{border-bottom:0}
#pov .pord .dot{flex:0 0 10px;height:10px;border-radius:3px;margin-top:4px}
#pov .pord .n{flex:1;min-width:0}
#pov .pord .n b{font-weight:700}
#pov .pord .n small{display:block;color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pov .pord .v{text-align:right;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
#pov .pord .v small{display:block;color:var(--dim);font-weight:500;font-size:11px}
#pov .pempty{font-size:13px;color:var(--dim);padding:6px 0}
.usritem{padding:9px 0;font-size:13px;border-bottom:1px solid rgba(51,65,85,.55)}
.usritem:last-child{border-bottom:0}
.usritem .uhead{display:flex;align-items:center;gap:8px}
.usritem .uem{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.usritem .umeta{margin-top:4px;color:var(--dim);font-size:11px}
.usritem .uact{display:flex;gap:6px;margin-top:6px}
.usritem .uact button{padding:5px 10px;font-size:12px}
.usritem.norole .uem{color:#fbbf24}
footer{display:flex;align-items:center;gap:10px;margin-top:14px}
/* Oznaka u kutu: odakle stranica cita podatke + je li zadnje citanje uspjelo */
#srcBadge{position:fixed;left:8px;bottom:6px;z-index:30;display:flex;align-items:center;gap:5px;font-size:11px;line-height:1;padding:4px 8px;border-radius:10px;background:rgba(30,41,59,.92);border:1px solid var(--line);color:var(--dim);pointer-events:none}
#srcBadge i{width:7px;height:7px;border-radius:50%;background:var(--idle)}
#srcBadge.ok i{background:var(--ok)}#srcBadge.bad i{background:var(--bad)}
#err{color:var(--bad);font-size:13px;margin:6px 4px}
#setup label{display:block;font-size:12px;color:var(--dim);margin:9px 0 3px}
#setup input,#setup select{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#0b1220;color:var(--txt);font:15px inherit}
#setup .row{display:flex;gap:8px;margin-top:13px}
#setup .hint{font-size:12px;color:var(--dim);margin-top:11px;line-height:1.45}
#setup .hint code{color:#cbd5e1}
/* Aplikacija ne salje (stanje.json stariji od 15 min): OFFLINE na sredini, kartice zamucene, zaglavlje s vremenom ostaje ostro. */
#cards,#sum{transition:filter .3s ease}
body.offline #cards,body.offline #sum{filter:blur(3px);opacity:.55}
#offline{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;pointer-events:none}
#offline .box{text-align:center;padding:16px 26px;border-radius:16px;border:1px solid #7f1d1d;background:rgba(15,23,42,.88);box-shadow:0 10px 40px rgba(0,0,0,.5)}
#offline b{display:block;font-size:34px;font-weight:900;letter-spacing:.12em;color:var(--bad)}
#offline span{display:block;margin-top:4px;font-size:13px;color:var(--dim)}
/* Android aplikacija (window.AndroidApp): admin dijelovi idu u postavke, zvonce za obavijesti u zaglavlju. */
#bell.on{background:#14532d;border-color:#166534}
#povBtn.on{background:#1d4ed8;border-color:#3b82f6}
body.povpage>*:not(header):not(#pov){display:none!important}
#pov .povclose{padding:4px 10px;margin-left:6px}
#pov .povref{padding:4px 10px;margin-left:auto}
#pov .povref:disabled{opacity:.55}
#pov .povref.spin span{display:inline-block;animation:povspin 1s linear infinite}
@keyframes povspin{to{transform:rotate(360deg)}}
body.app h1{flex:0 0 auto}
body.app #age{flex:1;min-width:0;white-space:normal;text-align:right;line-height:1.2}
#appBox .chk{display:flex;align-items:center;gap:9px;font-size:13px;margin:8px 0}
#appBox .chk input{width:18px;height:18px;margin:0}
#appBox .warnline{font-size:12px;color:var(--warn);margin:6px 0}
#appBox .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#appBox .dimline{font-size:12px;color:var(--dim);margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1 id="h1Title">Flexcell - admin</h1><div id="age">ucitavam...</div><button id="bell" class="gear" hidden>&#128277;</button><button id="povBtn" class="gear" hidden title="Povijest">&#128197;</button><button id="langBtn" class="lang" title="Jezik / Sprache">DE</button><button id="gear" class="gear" title="Postavke">&#9881;</button></header>
<div id="setup" class="card" hidden>
  <div id="setupHeading" style="font-weight:700;margin-bottom:2px">Postavke</div>
  <label id="lblRepo" hidden>Privatni repo s podacima (korisnik/repo)</label><input id="cfgRepo" placeholder="korisnik/flexcell-stanje" autocapitalize="off" autocorrect="off" spellcheck="false" hidden>
  <label id="lblPath" hidden>Datoteka</label><input id="cfgPath" placeholder="stanje.json" autocapitalize="off" autocorrect="off" spellcheck="false" hidden>
  <label id="lblBranch" hidden>Branch</label><input id="cfgBranch" placeholder="main" autocapitalize="off" autocorrect="off" spellcheck="false" hidden>
  <label id="lblEmail">E-mail</label><input id="cfgEmail" type="email" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="username">
  <label id="lblPass">Lozinka</label><input id="cfgPass" type="password" autocomplete="current-password">
  <div class="row"><button id="sbLogin" class="pri">Prijava</button><button id="sbLogout" hidden>Odjava</button></div>
  <div id="sbInfo" class="hint"></div>
  <label id="lblToken" style="margin-top:14px">Token s pravom pisanja</label><input id="cfgToken" type="password" placeholder="github_pat_..." autocapitalize="off" autocorrect="off" spellcheck="false">
  <label id="lblView" style="margin-top:14px">Prikaz programa</label><select id="cfgView"><option value="detalji" id="optViewDet">Detalji (slika + svojstva)</option><option value="slika" id="optViewImg">Velika slika</option></select>
  <div class="row"><button id="cfgSave">Spremi</button></div>
  <div id="setupHint" class="hint" hidden>Ova stranica salje zahtjev racunalu, pa token treba pravo <code>Contents: Read and write</code> na <b>privatni</b> repo s podacima. Token ostaje spremljen samo na ovom mobitelu.</div>
</div>
<div id="appBox" hidden>
<div id="notif" class="card">
  <div class="anahead"><span id="notifTitle" style="font-weight:700">Obavijesti</span><span id="notifState" class="anastate"></span></div>
  <label class="chk"><input id="notifStop" type="checkbox"><span id="notifStopLbl"></span></label>
  <label class="chk"><input id="notifOff" type="checkbox"><span id="notifOffLbl"></span></label>
  <div id="notifPerm" class="warnline" hidden></div>
  <div id="notifBat" class="warnline" hidden></div>
  <div class="row"><button id="notifPermBtn" hidden></button><button id="notifBatBtn" hidden></button><button id="notifTest"></button></div>
  <div id="appVer" class="dimline"></div>
  <div class="row"><button id="appUpd"></button></div>
</div>
</div>
<div id="cards"></div>
<div id="pov" class="card" hidden>
  <div class="anahead"><span id="povTitle" style="font-weight:700">Povijest</span><span id="povState" class="anastate"></span><button id="povRef" class="povref" title="Osvjezi"><span>&#10227;</span></button><button id="povClose" class="povclose">&#10005;</button></div>
  <div id="povDays" class="povdays"></div>
  <div id="povBody"></div>
</div>
<div id="ana" class="card">
  <div class="anahead"><span id="anaTitle" style="font-weight:700">Analiza</span><span id="anaState" class="anastate"></span></div>
  <div class="anarow">
    <select id="anaHours">
      <option value="6">6 h</option>
      <option value="12" selected>12 h</option>
      <option value="24">24 h</option>
      <option value="48">48 h</option>
    </select>
    <button id="anaReq" class="pri">Zatrazi analizu</button>
  </div>
  <div id="anaHint" class="anahint"></div>
  <div id="anaList" class="analist"></div>
</div>
<div id="use" class="card">
  <div class="anahead"><span id="useTitle" style="font-weight:700">Koristenje</span><span id="useState" class="anastate"></span></div>
  <div id="useList" class="uselist"></div>
</div>
<div id="usr" class="card" hidden>
  <div class="anahead"><span id="usrTitle" style="font-weight:700">Korisnici</span><span id="usrState" class="anastate"></span></div>
  <div class="usrform"><input id="usrName" placeholder="ime ili e-mail" autocapitalize="off" autocorrect="off" spellcheck="false"><select id="usrRole"><option value="korisnik">korisnik</option><option value="admin">admin</option></select><button id="usrAdd" class="pri">Dodaj</button></div>
  <div id="usrNew" class="usrnew" hidden></div>
  <div id="usrList" class="usrlist"></div>
</div>
<div id="sum" class="sum"></div>
<div id="err"></div>
<footer><button id="reload">Osvjezi</button><span id="src" style="font-size:11px;color:var(--dim)"></span></footer>
<div id="srcBadge"><i></i><span id="srcBadgeTxt"></span></div>
<div id="offline" hidden><div class="box"><b>OFFLINE</b><span id="offlineSub"></span></div></div>
<div id="tl" hidden><div class="tlbox"><div class="tlhead"><b id="tlTitle"></b><button id="tlClose">&#10005;</button></div><div id="tlBody"></div></div></div>
<script>
(function(){
var I18N={
  hr:{
    pageTitle:'Flexcell - admin',
    loading:'ucitavam...',
    gearTitle:'Postavke',

// Postavke se cuvaju samo na ovom mobitelu. Preko ?repo=&path=&branch= se mogu i predati linkom
// (token se linkom NE predaje).
function loadCfg(){
  var c={repo:'dadii82/flexcell-stanje',path:'stanje.json',branch:'main',token:''};
  try{var raw=localStorage.getItem(CFG_KEY);if(raw){var j=JSON.parse(raw);if(j&&typeof j==='object')for(var k in c)if(j[k])c[k]=String(j[k])}}catch(e){}
  ['repo','path','branch'].forEach(function(k){if(q.get(k))c[k]=String(q.get(k))});
  return c;
}
function saveCfg(c){try{localStorage.setItem(CFG_KEY,JSON.stringify(c))}catch(e){}}
function loadLang(){
  var l=q.get('lang');
  if(l==='hr'||l==='de')return l;
  try{var raw=localStorage.getItem(LANG_KEY);if(raw==='hr'||raw==='de')return raw}catch(e){}
  return 'hr';
}
function saveLang(l){try{localStorage.setItem(LANG_KEY,l)}catch(e){}}
// Zahtjev preziv i zatvaranje stranice: mobitel uspije stranicu ubiti dok PC jos radi izvoz.
function loadPending(){try{var j=JSON.parse(localStorage.getItem(PEND_KEY)||'null');return(j&&j.id)?j:null}catch(e){return null}}
function savePending(p){try{p?localStorage.setItem(PEND_KEY,JSON.stringify(p)):localStorage.removeItem(PEND_KEY)}catch(e){}}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;'})}
function statusClass(s){s=String(s||'');return s==='rad'?'b-rad':s==='podesavanje'?'b-pod':s==='pauza'?'b-pau':s==='stoj'?'b-stoj':s==='gotov'?'b-got':'b-prazno'}

function cardStatus(m){var s=String(m&&m.status||'');if((s==='stoj'||s==='pauza')&&!m.stale&&Number(m.total)>0&&Number(m.done)>=Number(m.total))return 'gotov';return s}

// Aplikacija salje staleMin (minute, -1 = nepoznato) pa se napomena prevodi ovdje, ne u aplikaciji.
function staleText(m){
  var min=Number(m.staleMin),age='';
  if(isFinite(min)&&min>=0)age=min>=120?Math.round(min/60)+' h':min+' min';
  return t().staleNote(age);
}
// Starost podataka se racuna i izmedju dohvacanja (setInterval), da OFFLINE izadje i kad dohvat ne uspije.
var offlineEl=document.getElementById('offline'),offlineSubEl=document.getElementById('offlineSub');
function updateAge(){
  var d=lastData;if(!d)return;
  var dict=t();
  var at=Date.parse(d.at||'')||0,min=at?Math.round((Date.now()-at)/60000):null;
  var off=min!=null&&min>15;
  ageEl.textContent=(d.atText||'')+(min!=null?'  ('+(min<1?dict.now:min+' '+dict.minSuffix)+')':'');
  ageEl.className=off?'stale':'';
  document.body.classList.toggle('offline',off);
  offlineEl.hidden=!off;
  if(off)offlineSubEl.textContent=dict.offlineSub(min>=120?Math.round(min/60)+' h':min+' '+dict.minSuffix);
}
var LF_COL={over:'#f87171',today:'#f87171',late:'#f87171',d1:'#f87171',d2:'#fb923c',d3:'#facc15'};
function lfText(x,dict){
  var n=Number(x.ln)||0;
  var c=Number(x.ld);
  if(x.ld!=null&&isFinite(c)){if(c<0)return dict.lfLate(-c);if(c===0)return dict.lfToday;if(c===1)return dict.lfTomorrow}
  else if(x.ls==='over')return dict.lfOver;
  if(x.ls==='d1'||x.ls==='d2'||x.ls==='d3'||x.ls==='late')return dict.lfLeft(n);return '';
}
function lfHtml(x,dict,short){
  if(!x||!x.lf)return '';
  var c=LF_COL[x.ls]||'',st=lfText(x,dict),day=short?String(x.lf).slice(0,6):x.lf;
  return '<b'+(c?' style="color:'+c+'"':'')+'>'+(c?'&#9200; ':'')+esc(day)+(st?' &middot; '+esc(st):'')+'</b>';
}
function render(d){
  lastData=d;
  var dict=t();
  var ms=(d.machines||[]);
  cards.innerHTML=ms.map(function(m){
    var pct=Math.max(0,Math.min(100,Number(m.pct)||0));
    var kv=[];
    if(m.done!=null&&m.total!=null)kv.push('<span>'+dict.kvPieces+' <b>'+num(m.done)+' / '+num(m.total)+'</b></span>');
    if(m.secPerPart)kv.push('<span>'+dict.kvSecPerPart+' <b>'+m.secPerPart+'</b></span>');

var imgCache={};
// Slike se trajno pamte na uredaju (Cache Storage): pri ulasku se odmah pokaze spremljena, a nova verzija
// se u pozadini provjeri najvise svakih 6 h (onUpdate zamijeni sliku ako je prozor jos otvoren).
var IMG_STORE='flexcell-slike-v1',IMG_MAX_AGE=6*3600000;
function imgStoreKey(path){return 'https://flexcell-slike.local/'+encodeURIComponent(String(path).split('?')[0])}
function imgStoreGet(path){
  try{if(!window.caches)return Promise.resolve(null)}catch(e){return Promise.resolve(null)}
  return caches.open(IMG_STORE).then(function(c){return c.match(imgStoreKey(path))})
    .then(function(r){return r?r.blob().then(function(b){return {b:b,t:Number(r.headers.get('x-saved'))||0}}):null})
    .catch(function(){return null});
}
function imgStorePut(path,b){
  try{if(!window.caches||!b)return}catch(e){return}
  caches.open(IMG_STORE).then(function(c){return c.put(imgStoreKey(path),new Response(b,{headers:{'Content-Type':b.type||'image/png','x-saved':String(Date.now())}}))}).catch(function(){});
}
function imgStoreClear(){try{if(window.caches)caches.delete(IMG_STORE).catch(function(){})}catch(e){}}
function fetchImageBlob(path){
  if(sbOn()){
    var name=String(path).replace(/^\/+/,'').replace(/^slike\//,'').split('?')[0];
    return sbFetch('/storage/v1/object/authenticated/slike/'+name.split('/').map(encodeURIComponent).join('/'))
      .then(function(r){return r.ok?r.blob():null}).catch(function(){return null});
  }
  var repo=slug(cfg.repo),tok=String(cfg.token||'').trim();
  return fetch('https://api.github.com/repos/'+repo+'/contents/'+encodeURI(path.replace(/^\/+/,'').split('?')[0])
      +'?ref='+encodeURIComponent(cfg.branch||'main')+'&t='+Date.now(),
      {cache:'no-store',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github.raw','X-GitHub-Api-Version':'2022-11-28'}})
    .then(function(r){return r.ok?r.blob():null}).catch(function(){return null});
}
function fetchImage(path,onUpdate){
  if(imgCache[path])return Promise.resolve(imgCache[path]);
  if(!sbOn()){
    var repo=slug(cfg.repo),tok=String(cfg.token||'').trim();
    // Bez tokena (lokalni server / javni repo): pokusaj datoteku uz stranicu.
    if(!repo||!tok)return Promise.resolve(path+(path.indexOf('?')<0?'?':'&')+'t='+Date.now());
  }
  var fresh=function(){return fetchImageBlob(path).then(function(b){if(!b)return '';imgStorePut(path,b);var u=URL.createObjectURL(b);imgCache[path]=u;return u})};
  return imgStoreGet(path).then(function(hit){
    if(!hit||!hit.b||!hit.b.size)return fresh();
    var u=URL.createObjectURL(hit.b);imgCache[path]=u;
    if(Date.now()-hit.t>IMG_MAX_AGE){
      fetchImageBlob(path).then(function(b){
        if(!b||!b.size)return;imgStorePut(path,b);
        if(b.size===hit.b.size)return;
        var nu=URL.createObjectURL(b);imgCache[path]=nu;if(onUpdate)onUpdate(nu);
      });
    }
    return u;
  });
}

// Profil alata iz .btd (mm, y gore negativno): okvir putanje (M/L tocke + krajevi lukova).
function profBox(d){
  var t=String(d||'').match(/[MLAZmlaz]|-?\d*\.?\d+(?:e-?\d+)?/g)||[],cmd='',i=0,xs=[],ys=[];
  while(i<t.length){
    if(/[A-Za-z]/.test(t[i])){cmd=t[i].toUpperCase();i++;if(cmd==='Z')continue}
    if(cmd==='A'){if(i+6<t.length){xs.push(+t[i+5]);ys.push(+t[i+6])}i+=7}
    else{if(i+1<t.length){xs.push(+t[i]);ys.push(+t[i+1])}i+=2}
  }
  if(!xs.length)return null;
  return {x0:Math.min.apply(null,xs),x1:Math.max.apply(null,xs),y0:Math.min.apply(null,ys),y1:Math.max.apply(null,ys)};
}

// Ima li stranica nacin za citanje (Supabase prijava ili GitHub token)?
function canRead(){return sbOn()||!!(token()&&slug(cfg.repo))}
// Privatni repo se cita preko contents API-ja (Accept: raw vraca sam sadrzaj datoteke).
// Ako token nije unesen, stranica pada na obicnu datoteku uz sebe - za javni repo / lokalni server.
// Oznaka u kutu: kind = 'github' | 'local' (kasnije 'supabase'), st = '' (ucitava) | 'ok' | 'bad'.
var srcKind='',srcTitle='',srcSt='';
function setSrcBadge(kind,st,title){
  if(kind)srcKind=kind;if(title!=null)srcTitle=title;if(st!=null)srcSt=st;
  var el=document.getElementById('srcBadge'),tx=document.getElementById('srcBadgeTxt');if(!el||!tx)return;
  var name=srcKind==='github'?'GitHub':srcKind==='supabase'?'Supabase':t().srcLocal;
  tx.textContent=t().srcLabel+': '+name;el.className=srcSt||'';el.title=srcTitle||'';

function load(){
  errEl.textContent='';
  if(sbOn())return loadSb();
  var repo=slug(cfg.repo),tok=token();
  var url,opt={cache:'no-store'};
  if(repo&&tok){
    url='https://api.github.com/repos/'+repo+'/contents/'+encodeURI(String(cfg.path||'stanje.json').replace(/^\/+/,''))
       +'?ref='+encodeURIComponent(cfg.branch||'main')+'&t='+Date.now();
    opt.headers={Authorization:'Bearer '+tok,Accept:'application/vnd.github.raw','X-GitHub-Api-Version':'2022-11-28'};
    srcEl.textContent=repo+'/'+(cfg.path||'stanje.json');
    setSrcBadge('github','',srcEl.textContent);
  }else{
    var f=SRC||'stanje.json';
    url=f+(f.indexOf('?')<0?'?':'&')+'t='+Date.now();
    srcEl.textContent=f;
    setSrcBadge('local','',f);
  }
  fetch(url,opt).then(function(r){
    var dict=t();
    if(r.status===401||r.status===403)throw new Error(dict.errTokenRejected(r.status));
    if(r.status===404)throw new Error(dict.errNoFile);
    if(!r.ok)throw new Error(dict.errHttp(r.status));
    return r.text();
  }).then(function(txt){
    var d;try{d=JSON.parse(txt)}catch(e){throw new Error(t().errBadJson)}
    render(d);
    setSrcBadge('','ok');
  }).catch(function(e){
    fail(t().errFetchPrefix+(e&&e.message||e));
    setSrcBadge('','bad');
    if(!slug(cfg.repo)||!token())openSetup();
  });
}
function loadSb(){

    setSrcBadge('','bad');
    if(!sbOn())openSetup();
  });
}
// ---- analiza: zahtjev, odgovor, popis ----
function ghUrl(path){return 'https://api.github.com/repos/'+slug(cfg.repo)+'/contents/'+encodeURI(String(path||'').replace(/^\/+/,''))}
function ghHeaders(accept){return{Authorization:'Bearer '+token(),Accept:accept||'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
// Bez kesiranja: GitHub API salje max-age=60, pa bi se stari odgovor/sha vrtio u krug.
function ghGet(path,accept){
  return fetch(ghUrl(path)+'?ref='+encodeURIComponent(cfg.branch||'main')+'&t='+Date.now(),{cache:'no-store',headers:ghHeaders(accept)});
}
function b64(s){return btoa(unescape(encodeURIComponent(String(s))))}
function randId(){
  var a=new Uint8Array(8);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);
  else for(var i=0;i<8;i++)a[i]=Math.floor(Math.random()*256);
  return Array.prototype.map.call(a,function(x){return ('0'+x.toString(16)).slice(-2)}).join('');
}
function setAnaState(txt,cls){anaStateEl.textContent=txt||'';anaStateEl.className='anastate'+(cls?' '+cls:'')}
function elapsedText(ms){
  var s=Math.max(0,Math.round(ms/1000));
  return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);
}
function sendRequest(){
  var dict=t();
  if(!canRead()){setAnaState(dict.anaNoToken,'bad');openSetup();return}
  var hours=Math.max(1,Math.round(Number(anaHoursEl.value)||12));
  anaBtn.disabled=true;
  setAnaState(dict.anaSending,'work');
  if(sbOn()){
    var sid=randId();
    sbJson('/rest/v1/zahtjevi',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({id:sid,sati:hours})})
      .then(function(){pending={id:sid,hours:hours,at:Date.now(),sb:1};savePending(pending);tickPending()})
      .catch(function(e){setAnaState(t().anaFailed(e&&e.message||e),'bad');anaBtn.disabled=false});
    return;
  }
  ghGet(REQ_PATH).then(function(r){
    if(r.status===404)return '';
    if(r.status===401||r.status===403)throw new Error(dict.errTokenRejected(r.status));
    if(!r.ok)throw new Error(dict.errHttp(r.status));
    return r.json().then(function(j){return String(j&&j.sha||'')});
  }).then(function(sha){
    var id=randId();
    var body={hours:hours,id:id,at:new Date().toISOString(),from:'analiza.html'};
    var payload={message:'zahtjev za analizu '+hours+'h',content:b64(JSON.stringify(body)),branch:cfg.branch||'main'};
    if(sha)payload.sha=sha;
    return fetch(ghUrl(REQ_PATH),{method:'PUT',cache:'no-store',headers:ghHeaders(),body:JSON.stringify(payload)}).then(function(r){
      if(r.status===403)throw new Error(dict.anaNoWrite);
      if(r.status===401)throw new Error(dict.errTokenRejected(r.status));
      if(!r.ok)throw new Error(dict.errHttp(r.status));
      pending={id:id,hours:hours,at:Date.now()};
      savePending(pending);
      tickPending();
    });
  }).catch(function(e){
    setAnaState(t().anaFailed(e&&e.message||e),'bad');
    anaBtn.disabled=false;
  });
}
function tickPending(){
  if(!pending){anaBtn.disabled=false;return}
  var waited=Date.now()-Number(pending.at||0);
  if(waited>REQ_TIMEOUT_MS){
    pending=null;savePending(null);anaBtn.disabled=false;
    setAnaState(t().anaTimeout,'bad');
    return;
  }
  anaBtn.disabled=true;
  setAnaState(t().anaWaiting(elapsedText(waited)),'work');
}
function pollAnswer(){
  if(pending&&pending.sb){
    if(!sbOn())return;
    sbJson('/rest/v1/zahtjevi?id=eq.'+encodeURIComponent(pending.id)+'&select=stanje,odgovor').then(function(rows){
      var r=rows&&rows[0];
      if(!r||r.stanje==='novo'||!pending)return;
      var j=r.odgovor||{};
      pending=null;savePending(null);anaBtn.disabled=false;
      if(r.stanje==='gotovo'&&j.ok!==false){setAnaState(t().anaDone,'ok');loadAnaList()}
      else setAnaState(t().anaFailed(String(j.err||r.stanje)),'bad');
    }).catch(function(){});
    return;
  }
  if(!pending||!token()||!slug(cfg.repo))return;
  ghGet(ANS_PATH,'application/vnd.github.raw').then(function(r){
    if(!r.ok)return null;
    return r.text();
  }).then(function(txt){
    if(!txt||!pending)return;
    var j;try{j=JSON.parse(txt)}catch(e){return}
    if(!j||String(j.id||'')!==String(pending.id))return;
    pending=null;savePending(null);anaBtn.disabled=false;
    if(j.ok){
      setAnaState(t().anaDone,'ok');
      loadAnaList();
    }else{
      setAnaState(t().anaFailed(String(j.err||'')),'bad');
    }
  }).catch(function(){});
}
// flexcell-analiza-12h-20260918-092700.json.gz  ->  "12 h - 18.09.2026 09:27"
function describeAnaFile(name){
  var m=/^flexcell-analiza-(\d+)h-(\d{4})(\d{2})(\d{2})(?:-(\d{2})(\d{2})(\d{2}))?\./i.exec(String(name||''));
  if(!m)return{label:String(name||''),sub:'',ts:0};
  var h=Number(m[1]),y=Number(m[2]),mo=Number(m[3]),d=Number(m[4]);
  var hh=m[5]?Number(m[5]):0,mi=m[6]?Number(m[6]):0,ss=m[7]?Number(m[7]):0;
  var dateTxt=('0'+d).slice(-2)+'.'+('0'+mo).slice(-2)+'.'+y+(m[5]?' '+('0'+hh).slice(-2)+':'+('0'+mi).slice(-2):'');
  return{label:t().anaHours(h)+'  -  '+dateTxt,sub:m[5]?'':t().anaNightly,ts:new Date(y,mo-1,d,hh,mi,ss).getTime()};
}
function sizeText(bytes){
  var b=Number(bytes)||0;
  return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' kB';
}
function loadAnaList(){
  if(!canRead()){anaListEl.innerHTML='';return}
  var src=sbOn()
    ?sbJson('/storage/v1/object/list/analiza',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefix:'',limit:100,sortBy:{column:'name',order:'desc'}})})
      .then(function(arr){return (arr||[]).filter(function(x){return x&&x.id}).map(function(x){return {type:'file',name:x.name,path:x.name,size:x.metadata&&x.metadata.size,sb:1}})})
    :ghGet(ANA_DIR).then(function(r){
    if(r.status===404)return [];
    if(!r.ok)throw new Error(t().errHttp(r.status));
    return r.json();
  });
  src.then(function(arr){
    if(!Array.isArray(arr))arr=[];
    var rows=arr.filter(function(x){return x&&x.type==='file'}).map(function(x){
      var info=describeAnaFile(x.name);
      return{name:String(x.name||''),path:String(x.path||''),size:Number(x.size)||0,label:info.label,sub:info.sub,ts:info.ts,sb:!!x.sb};
    }).sort(function(a,b){return (b.ts-a.ts)||(a.name<b.name?1:-1)}).slice(0,10);
    if(!rows.length){anaListEl.innerHTML='<div class="analistempty">'+esc(t().anaListEmpty)+'</div>';return}
    anaListEl.innerHTML=rows.map(function(r,i){
      var sub=[r.sub,sizeText(r.size)].filter(Boolean).join('  -  ');
      return '<div class="anaitem"><span class="nm"><b>'+esc(r.label)+'</b><span>'+esc(sub)+'</span></span>'
        +'<button data-i="'+i+'">'+esc(t().anaDl)+'</button></div>';
    }).join('');
    Array.prototype.forEach.call(anaListEl.querySelectorAll('button[data-i]'),function(b){
      b.addEventListener('click',function(){downloadAna(rows[Number(b.getAttribute('data-i'))],b)});
    });
  }).catch(function(){anaListEl.innerHTML=''});
}
// .gz se raspakira u pregledniku da na mobitelu zavrsi obican .json; ako preglednik nema
// DecompressionStream, spremi se stisnuta datoteka kakva jest.
function downloadAna(row,btn){
  if(!row)return;
  var dict=t(),old=btn.textContent;
  btn.disabled=true;btn.textContent=dict.anaDlWorking;
  (row.sb?sbFetch('/storage/v1/object/authenticated/analiza/'+row.name.split('/').map(encodeURIComponent).join('/')):ghGet(row.path,'application/vnd.github.raw')).then(function(r){
    if(!r.ok)throw new Error(dict.errHttp(r.status));
    return r.arrayBuffer();
  }).then(function(buf){
    var gz=/\.gz$/i.test(row.name);
    if(gz&&typeof DecompressionStream!=='undefined'){
      return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).blob()
        .then(function(b){return{blob:b,name:row.name.replace(/\.gz$/i,'')}});
    }
    return{blob:new Blob([buf]),name:row.name};
  }).then(function(o){
    if(APP&&APP.spremi){
      return new Promise(function(res){var fr=new FileReader();fr.onload=function(){res(String(fr.result||''))};fr.readAsDataURL(o.blob)}).then(function(du){
        APP.spremi(o.name,String(du).replace(/^data:[^,]*,/,''));
        btn.disabled=false;btn.textContent=old;
      });
    }
    var u=URL.createObjectURL(o.blob),a=document.createElement('a');
    a.href=u;a.download=o.name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1500);
    btn.disabled=false;btn.textContent=old;
  }).catch(function(e){
    btn.disabled=false;btn.textContent=old;
    setAnaState(dict.anaDlFailed(e&&e.message||e),'bad');
  });
}

var VNAMES_KEY='flexcell-visit-names';
var useStateEl=document.getElementById('useState'),useListEl=document.getElementById('useList');
function loadVNames(){try{var j=JSON.parse(localStorage.getItem(VNAMES_KEY)||'{}');return(j&&typeof j==='object')?j:{}}catch(e){return{}}}
function saveVName(id,name){try{var m=loadVNames();if(name)m[id]=name;else delete m[id];localStorage.setItem(VNAMES_KEY,JSON.stringify(m))}catch(e){}}
// Gledanja razmaknuta manje od 2 min od prethodnog su isto gledanje (ostaje prvo).
function mergeViews(v){
  var out=[],prev=0;
  (v||[]).map(function(x){return Date.parse(x||'')||0}).filter(Boolean).sort(function(a,b){return a-b}).forEach(function(ms){
    if(!prev||ms-prev>=2*60*1000)out.push(new Date(ms).toISOString());prev=ms;
  });
  return out;
}
// Zadnjih 6 gledanja (najnovije prvo); stari zapisi imaju sessions[].s umjesto views.
function lastViews(rec){
  var v=(rec&&rec.views&&rec.views.slice)?rec.views.slice():(((rec&&rec.sessions)||[]).map(function(x){return x&&x.s}).filter(Boolean));
  var p=function(n){return(n<10?'0':'')+n};
  return mergeViews(v).slice(-6).reverse().map(function(iso){var dt=new Date(iso);return isNaN(dt)?'':p(dt.getDate())+'.'+p(dt.getMonth()+1)+'. '+p(dt.getHours())+':'+p(dt.getMinutes())}).filter(Boolean);
}
// Koliko je proslo od zadnje aktivnosti, npr. "1 h 13 min", i tocno vrijeme, npr. "03:28" ili "02.11. 17:44".
function useAgo(ms,d){
  var min=Math.max(0,Math.round((Date.now()-ms)/60000));
  if(min<60)return min+' '+d.minSuffix;
  if(min<1440){var m=min%60;return Math.floor(min/60)+' h'+(m?' '+m+' '+d.minSuffix:'')}
  return Math.floor(min/1440)+' d';
}
function useClock(ms){
  var dt=new Date(ms),n=new Date(),p=function(x){return(x<10?'0':'')+x};
  var hm=p(dt.getHours())+':'+p(dt.getMinutes());
  return dt.toDateString()===n.toDateString()?hm:p(dt.getDate())+'.'+p(dt.getMonth()+1)+'. '+hm;
}
function renderVisits(rows){
  var d=t(),names=loadVNames();
  if(!rows.length){useListEl.innerHTML='<div class="useempty">'+esc(d.useEmpty)+'</div>';return}
  useListEl.innerHTML=rows.map(function(r,i){
    var lastMs=Date.parse(r.last||'')||0,online=lastMs&&(Date.now()-lastMs)<7*60000;
    var relTxt=lastMs?(online?d.useOnline:useAgo(lastMs,d)+' ('+useClock(lastMs)+')'):d.useNever;
    var nm=names[r.id]||r.sbName||'';
    var views=lastViews(r);
    return '<div class="useitem"><div class="uhead">'
      +'<input data-id="'+esc(r.id)+'" placeholder="'+esc(d.useName)+'" value="'+esc(nm)+'">'
      +'<span class="ubadge'+(online?' on':'')+'">'+esc(online?d.useOnline:d.useLast+' '+relTxt)+'</span></div>'
      +'<div class="umeta">'+(r.email?esc(r.email):'token …'+esc(r.tail||'????'))+(r.ver?'  ·  v'+esc(r.ver):'')+'  ·  '+esc(d.useViews.replace(/:$/,''))+'</div>'
      +'<div class="uviews">'+(views.length?views.map(function(x){return '<span>'+esc(x)+'</span>'}).join(''):'<span>-</span>')+'</div></div>';
  }).join('');
  Array.prototype.forEach.call(useListEl.querySelectorAll('input[data-id]'),function(inp){
    inp.addEventListener('change',function(){saveVName(inp.getAttribute('data-id'),String(inp.value||'').trim())});
  });
}
function loadVisits(){
  if(sbOn()){
    Promise.all([sbJson('/rest/v1/koristenje?select=*'),sbJson('/rest/v1/uloge?select=user_id,ime,uloga').catch(function(){return []})]).then(function(res){
      var ul={};(res[1]||[]).forEach(function(u){ul[u.user_id]=u});
      var rows=(res[0]||[]).map(function(k){
        var u=ul[k.user_id]||{};
        return {id:k.user_id,sbName:u.ime||String(k.email||'').split('@')[0],email:k.email||'',last:k.zadnji,views:Array.isArray(k.sesije)?k.sesije:[],ver:k.ver,page:k.stranica};
      }).sort(function(a,b){return (Date.parse(b.last||'')||0)-(Date.parse(a.last||'')||0)});
      setUseState('');renderVisits(rows);
    }).catch(function(){setUseState(t().useLoadFail,'bad')});
    return;
  }
  if(!token()||!slug(cfg.repo)){useListEl.innerHTML='';return}
  ghGet('cache').then(function(r){
    if(r.status===404)return [];
    if(!r.ok)throw new Error(t().errHttp(r.status));
    return r.json();
  }).then(function(arr){
    if(!Array.isArray(arr))arr=[];
    var files=arr.filter(function(x){return x&&x.type==='file'&&/\.json$/i.test(x.name||'')});
    return Promise.all(files.map(function(f){
      return ghGet(f.path,'application/vnd.github.raw').then(function(r){return r.ok?r.text():''}).then(function(txt){
        try{return JSON.parse(txt)}catch(e){return null}
      }).catch(function(){return null});
    }));
  }).then(function(recs){
    var rows=(recs||[]).filter(function(x){return x&&x.id}).sort(function(a,b){return (Date.parse(b.last||'')||0)-(Date.parse(a.last||'')||0)});
    setUseState('');
    renderVisits(rows);
  }).catch(function(e){setUseState(t().useLoadFail,'bad');});
}

      usrCall({akcija:'uloga',user_id:u.id,uloga:sel.value}).then(function(){setUsrState(t().usrSaved,'ok');loadUsers()})
        .catch(function(e){setUsrState(t().usrFail(e&&e.message||e),'bad');loadUsers()});
    });
  });
  Array.prototype.forEach.call(usrListEl.querySelectorAll('button[data-pwd]'),function(b){
    b.addEventListener('click',function(){
      var u=usrRows[Number(b.getAttribute('data-pwd'))];if(!u||!confirm(t().usrPwdAsk(u.email)))return;
      setUsrState(t().usrWorking,'work');
      usrCall({akcija:'lozinka',user_id:u.id}).then(function(j){setUsrState('');usrShowNew(t().usrPwdNew(esc(u.email),esc(j.lozinka)))})
        .catch(function(e){setUsrState(t().usrFail(e&&e.message||e),'bad')});
    });
  });
  Array.prototype.forEach.call(usrListEl.querySelectorAll('button[data-del]'),function(b){
    b.addEventListener('click',function(){
      var u=usrRows[Number(b.getAttribute('data-del'))];if(!u||!confirm(t().usrDelAsk(u.email)))return;
      setUsrState(t().usrWorking,'work');
      usrCall({akcija:'obrisi',user_id:u.id}).then(function(){setUsrState(t().usrSaved,'ok');loadUsers()})
        .catch(function(e){setUsrState(t().usrFail(e&&e.message||e),'bad')});
    });
  });
}
function loadUsers(){
  if(!sbOn()||sbRole!=='admin')return;
  usrCall({akcija:'popis'}).then(function(j){usrRows=j.korisnici||[];setUsrState('');renderUsers()})
    .catch(function(e){setUsrState(t().usrFail(e&&e.message||e),'bad')});
}
function addUser(){
  var nm=String(document.getElementById('usrName').value||'').trim();if(!nm)return;
  var btn=document.getElementById('usrAdd');btn.disabled=true;usrShowNew('');setUsrState(t().usrWorking,'work');
  usrCall({akcija:'novi',email:nm,uloga:document.getElementById('usrRole').value}).then(function(j){
    btn.disabled=false;setUsrState('');document.getElementById('usrName').value='';
    usrShowNew(t().usrCreated(esc(j.email),esc(j.lozinka)));loadUsers();
  }).catch(function(e){btn.disabled=false;setUsrState(t().usrFail(e&&e.message||e),'bad')});
}
document.getElementById('usrAdd').addEventListener('click',addUser);
document.getElementById('usrName').addEventListener('keydown',function(e){if(e.key==='Enter')addUser()});
document.getElementById('sbLogin').addEventListener('click',sbLogin);
document.getElementById('cfgPass').addEventListener('keydown',function(e){if(e.key==='Enter')sbLogin()});
document.getElementById('sbLogout').addEventListener('click',sbLogout);
anaBtn.addEventListener('click',sendRequest);

// --- Android aplikacija ---
// Ljuska (APK) daje window.AndroidApp. Tada su Analiza i Koristenje u postavkama (zupcanik), a zvonce
// u zaglavlju pali/gasi obavijesti. Provjeru stanja radi sama aplikacija u pozadini (i kad je zatvorena),
// zato joj se ovdje predaju postavke repoa i token (ostaju na mobitelu).
var APP=window.AndroidApp||null;
var appBoxEl=document.getElementById('appBox'),bellEl=document.getElementById('bell');
function appState(){try{return JSON.parse(APP.obavijestiStanje()||'{}')||{}}catch(e){return{}}}
function appSync(){
  if(!APP)return;
  try{APP.postavke(JSON.stringify({repo:slug(cfg.repo),path:cfg.path||'stanje.json',branch:cfg.branch||'main',token:String(cfg.token||'').trim(),lang:lang}))}catch(e){}
}
function appRefresh(){
  if(!APP)return;
  var d=t(),st=appState(),on=!!st.ukljuceno;
  bellEl.innerHTML=on?'&#128276;':'&#128277;';
  bellEl.className='gear'+(on?' on':'');
  bellEl.title=on?d.bellOn:d.bellOff;
  document.getElementById('notifTitle').textContent=d.notifTitle;
  var ns=document.getElementById('notifState');
  ns.textContent=!String(cfg.token||'').trim()?d.notifNoToken:(on?d.notifOn:d.notifOffState);
  ns.className='anastate'+(on?' ok':'');
  document.getElementById('notifStopLbl').textContent=d.notifStop;
  document.getElementById('notifOffLbl').textContent=d.notifOffline;
  document.getElementById('notifStop').checked=on;
  document.getElementById('notifOff').checked=st.offline!==false;
  var perm=on&&st.dozvola===false,bat=on&&st.baterija===false;
  document.getElementById('notifPerm').hidden=!perm;document.getElementById('notifPerm').textContent=d.notifPerm;
  document.getElementById('notifPermBtn').hidden=!perm;document.getElementById('notifPermBtn').textContent=d.notifPermBtn;
  document.getElementById('notifBat').hidden=!bat;document.getElementById('notifBat').textContent=d.notifBat;
  document.getElementById('notifBatBtn').hidden=!bat;document.getElementById('notifBatBtn').textContent=d.notifBatBtn;
  document.getElementById('notifTest').textContent=d.notifTest;
  document.getElementById('appUpd').textContent=d.appUpd;
  var v='';try{v=APP.verzija()}catch(e){}
  document.getElementById('appVer').textContent=d.appVer(v)+(pageVer()?' · '+d.version+' '+pageVer():'');
}
function pageVer(){var m=document.querySelector('meta[name="flexcell-page-version"]');return m?String(m.getAttribute('content')||''):''}
function appSetOn(on){
  if(!APP)return;
  if(on&&!String(cfg.token||'').trim()){openSetup();appBoxEl.hidden=false;appRefresh();return}
  appSync();
  try{APP.obavijesti(!!on)}catch(e){}
  appRefresh();
}
// Ljuska javlja ishod (dozvola obavijesti / povratak u aplikaciju, nadogradnja).
window.FX_OBAVIJESTI=function(){appRefresh()};
window.FX_NADOGRADNJA=function(s){var m=t().appUpdState;document.getElementById('appVer').textContent=m[s]||s};
if(APP){
  document.body.classList.add('app');
  bellEl.hidden=false;
  appBoxEl.appendChild(document.getElementById('ana'));
  appBoxEl.appendChild(document.getElementById('use'));
  appBoxEl.appendChild(document.getElementById('usr'));
  bellEl.addEventListener('click',function(){appSetOn(!appState().ukljuceno)});
  document.getElementById('notifStop').addEventListener('change',function(e){appSetOn(e.target.checked)});
  document.getElementById('notifOff').addEventListener('change',function(e){try{APP.obavijestiOffline(e.target.checked)}catch(x){}appRefresh()});
  document.getElementById('notifPermBtn').addEventListener('click',function(){try{APP.dozvola()}catch(e){}});
  document.getElementById('notifBatBtn').addEventListener('click',function(){try{APP.baterija()}catch(e){}});
  document.getElementById('notifTest').addEventListener('click',function(){try{APP.proba()}catch(e){}});
  document.getElementById('appUpd').addEventListener('click',function(){try{APP.nadogradi()}catch(e){}});
  appSync();
  appRefresh();
}

// ---- povijest zadnjih 7 dana (samo admin, tablica povijest_dan) ----
// Racunalo salje red po danu i stroju: segs = [od, do, nalog] u sekundama od ponoci, ord = nalozi.
var povRows=null,povErr='',povSel='',povAt=0,povReq={id:'',at:0,msg:'',bad:false,timer:0};
var POV_COL=['#38bdf8','#22c55e','#f59e0b','#a78bfa','#f472b6','#2dd4bf','#fb7185','#a3e635','#fbbf24','#60a5fa'];
function povYmd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function povDayList(){var out=[],n=new Date();for(var i=0;i<7;i++){var d=new Date(n.getFullYear(),n.getMonth(),n.getDate()-i);out.push({ymd:povYmd(d),d:d,i:i})}return out}
function povClock(dayMs,sec){if(sec>=86000&&new Date(dayMs+sec*1000).getHours()===0)return '24:00';var d=new Date(dayMs+sec*1000);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function povDur(sec){sec=Math.max(0,Math.round(sec/60));var h=Math.floor(sec/60),m=sec%60;return h?h+'h '+('0'+m).slice(-2)+'m':m+'m'}
function loadPov(){
  if(!sbOn()||sbRole!=='admin')return;
  var from=povDayList()[6].ymd;
  sbJson('/rest/v1/povijest_dan?select=dan,stroj,podaci,at&dan=gte.'+from+'&order=dan.desc').then(function(rows){
    povRows=rows||[];povErr='';povAt=Date.now();renderPov();
  }).catch(function(e){
    var m=String(e&&e.message||e);povErr=/404|PGRST205|povijest_dan/.test(m)?t().povNoTable:m;renderPov();
  });
}
function renderPov(){
  var box=document.getElementById('pov');if(!box||box.hidden)return;
  var d=t(),st=document.getElementById('povState'),daysEl=document.getElementById('povDays'),body=document.getElementById('povBody');
  var list=povDayList();if(!povSel)povSel=list[0].ymd;
  var byDay={},machSeen={},lastAt=0;
  (povRows||[]).forEach(function(r){(byDay[r.dan]=byDay[r.dan]||{})[r.stroj]=r;var p=r.podaci||{};if(p.rad>0||(p.segs&&p.segs.length))machSeen[r.stroj]=1;var a=Date.parse(r.at||'')||0;if(a>lastAt)lastAt=a});
  st.className='anastate'+(povErr||povReq.bad?' bad':'');
  st.textContent=povErr?povErr:povReq.msg?povReq.msg:(lastAt?d.povUpd(new Date(lastAt).toLocaleString(lang==='de'?'de-AT':'hr-HR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})):'');
  daysEl.innerHTML=list.map(function(x){
    var lbl=x.i===0?d.povToday:x.i===1?d.povYest:d.povDayNames[x.d.getDay()];
    return '<button data-pov="'+x.ymd+'"'+(x.ymd===povSel?' class="on"':'')+'>'+esc(lbl)+'<small>'+('0'+x.d.getDate()).slice(-2)+'.'+('0'+(x.d.getMonth()+1)).slice(-2)+'.</small></button>';
  }).join('');
  if(povRows==null){body.innerHTML=povErr?'':'<div class="pempty">'+esc(d.loading)+'</div>';return}
  if(!povRows.length){body.innerHTML='<div class="pempty">'+esc(d.povEmpty)+'</div>';return}
  var day=byDay[povSel];
  if(!day){body.innerHTML='<div class="pempty">'+esc(d.povNone)+'</div>';return}
  var machs=Object.keys(machSeen).sort();if(!machs.length)machs=Object.keys(day).sort();
  body.innerHTML=machs.map(function(m){
    var r=day[m];
    if(!r)return '<div class="povm"><div class="ph"><b>'+esc(m)+'</b><span>-</span></div></div>';
    var p=r.podaci||{},len=Number(p.len)||86400,dayMs=Number(p.dayMs)||0,upTo=Math.min(len,Number(p.do)||len),ord=p.ord||[],segs=p.segs||[];
    var h='<div class="povm"><div class="ph"><b>'+esc(m)+'</b><span>'+(p.rad>0?d.povWork+' <em>'+povDur(p.rad)+'</em> · <em>'+(Number(p.kom)||0)+'</em> '+d.povPcs:esc(d.povIdle))+(upTo<len?'<br>'+esc(d.povUpTo(povClock(dayMs,upTo))):'')+'</span></div>';
    h+='<div class="pbar">';
    for(var hr=3;hr<24;hr+=3)h+='<span class="tk" style="left:'+(hr*3600/len*100).toFixed(3)+'%"></span>';
    segs.forEach(function(s){var a=s[0]/len*100,w=Math.max(0,(s[1]-s[0])/len*100);h+='<i style="left:'+a.toFixed(3)+'%;width:'+w.toFixed(3)+'%;background:'+POV_COL[(s[2]||0)%POV_COL.length]+'"></i>'});
    if(upTo<len)h+='<span class="fut" style="left:'+(upTo/len*100).toFixed(3)+'%"></span>';
    h+='</div><div class="pticks"><span style="left:0">0</span><span style="left:25%">6</span><span style="left:50%">12</span><span style="left:75%">18</span><span style="left:100%">24</span></div>';
    var idx=ord.map(function(o,i){return i}).sort(function(a,b){return (ord[a].od||0)-(ord[b].od||0)});
    idx.forEach(function(i){
      var o=ord[i],sub=[o.prog?'CNC '+o.prog:'',o.art||'',o.ku||''].filter(Boolean).join(' · ');
      h+='<div class="pord"><span class="dot" style="background:'+POV_COL[i%POV_COL.length]+'"></span><div class="n"><b>'+esc(o.ip||d.povNoIp)+'</b><small>'+esc(sub||'-')+'</small><small>'+povClock(dayMs,o.od)+' – '+povClock(dayMs,o.do)+'</small></div><div class="v">'+(Number(o.kom)||0)+' '+d.povPcs+'<small>'+povDur(o.sec)+'</small></div></div>';
    });
    return h+'</div>';
  }).join('');
}
document.getElementById('povDays').addEventListener('click',function(e){var b=e.target.closest('button[data-pov]');if(!b)return;povSel=b.getAttribute('data-pov');renderPov();if(Date.now()-povAt>60000)loadPov()});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&povOpen()&&Date.now()-povAt>5*60000)loadPov()});
// Povijest je zasebna stranica: gumb pored postavki je otvara (ostalo se sakrije, zaglavlje ostaje),
// isti gumb, X ili Esc vraca na pregled na isto mjesto.
var povScrollY=0;
function povOpen(){return document.body.classList.contains('povpage')}
function openPov(){
  if(sbRole!=='admin'||povOpen())return;
  povScrollY=window.scrollY||0;
  document.getElementById('pov').hidden=false;document.body.classList.add('povpage');document.getElementById('povBtn').classList.add('on');
  window.scrollTo(0,0);renderPov();
  if(povRows==null||Date.now()-povAt>60000)loadPov();
}
function closePov(){
  var was=povOpen();
  document.getElementById('pov').hidden=true;document.body.classList.remove('povpage');document.getElementById('povBtn').classList.remove('on');
  if(was)window.scrollTo(0,povScrollY);
}
document.getElementById('povBtn').addEventListener('click',function(){povOpen()?closePov():openPov()});
document.getElementById('povClose').addEventListener('click',closePov);
// Gumb osvjezi: odmah ponovno procita Supabase i zatrazi od racunala (tablica zahtjevi, id "pov-...")
// da procita povijest strojeva i posalje svjeze; kad javi gotovo, stranica opet ucita povijest.
function povReqEnd(msg,bad){
  clearInterval(povReq.timer);povReq.timer=0;povReq.id='';povReq.msg=msg||'';povReq.bad=!!bad;
  var b=document.getElementById('povRef');b.disabled=false;b.classList.remove('spin');
  renderPov();
  if(msg&&!bad)setTimeout(function(){if(!povReq.id&&povReq.msg===msg){povReq.msg='';renderPov()}},8000);
}
function povReqPoll(){
  if(!povReq.id)return;
  if(Date.now()-povReq.at>4*60000){povReqEnd(t().povReqTimeout,true);return}
  sbJson('/rest/v1/zahtjevi?id=eq.'+encodeURIComponent(povReq.id)+'&select=stanje,odgovor').then(function(rows){
    var r=rows&&rows[0];if(!r||!povReq.id||r.stanje==='novo')return;
    if(r.stanje==='gotovo'){povReqEnd(t().povReqOk,false);loadPov()}
    else povReqEnd(t().povReqErr((r.odgovor&&r.odgovor.err)||r.stanje),true);
  }).catch(function(){});
}
document.getElementById('povRef').addEventListener('click',function(){
  if(povReq.id||!sbOn()||sbRole!=='admin')return;
  loadPov();
  var id='pov-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
  var b=document.getElementById('povRef');b.disabled=true;b.classList.add('spin');
  povReq.id=id;povReq.at=Date.now();povReq.msg=t().povReqWait;povReq.bad=false;renderPov();
  sbJson('/rest/v1/zahtjevi',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({id:id,sati:1})})
    .then(function(){povReq.timer=setInterval(povReqPoll,5000)})
    .catch(function(e){povReqEnd(t().povReqErr(String(e&&e.message||e)),true)});
});
document.addEventListener('keydown',function(e){if(povOpen()&&(e.key==='Escape'||e.key==='Esc'))closePov()});
setInterval(load,30000);
setInterval(updateAge,30000);
setInterval(pollAnswer,POLL_MS);
setInterval(tickPending,1000);
setInterval(loadVisits,60000);
setInterval(function(){if(povOpen()&&!document.hidden)loadPov()},5*60000);
applyStaticText();
if(!sbOn()&&!token()&&!SRC)openSetup();
if(sbOn())sbLoadRole().catch(function(){});
load();
tickPending();
pollAnswer();
loadAnaList();
loadVisits();
})();
